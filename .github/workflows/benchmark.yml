name: Benchmark (Python) checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: LahaLuhem/dartender/actions/setup-python-uv@main
        with:
          working-directory: benchmark/python
      - working-directory: benchmark/python
        run: uv run ruff check .

  format:
    name: Ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: LahaLuhem/dartender/actions/setup-python-uv@main
        with:
          working-directory: benchmark/python
      - working-directory: benchmark/python
        run: uv run ruff format --check .

  test:
    name: Pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: LahaLuhem/dartender/actions/setup-python-uv@main
        with:
          working-directory: benchmark/python
      - working-directory: benchmark/python
        run: uv run pytest --cov-fail-under=95

  # better's own ruleset requires this job's id, so the jobs above can change without touching it.
  benchmark-ok:
    needs: [lint, format, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: >-
            lint=${{ needs.lint.result }}
            format=${{ needs.format.result }}
            test=${{ needs.test.result }}
        run: echo "$RESULTS"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
